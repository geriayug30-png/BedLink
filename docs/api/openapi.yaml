openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: BedLink API contract
  version: 1.2.0
  description: Step 1 contract with Step 3 availability and Step 4 matching implementations; workflow operations remain planned. JSON uses camelCase. REST with Supabase Auth bearer
    access tokens. Server time and inventory are authoritative. Read decisions.md and frontend-handoff.md for normative
    cross-resource invariants, ranking, idempotency and lifecycle rules. No patient names or clinical notes. Unknown
    input fields/queries are 400. All bodies are application/json; every response includes serverTime. All timestamps
    end in Z. API deployment URL remains configurable.
servers:
- url: /api/v1
  description: Relative base path on the configured API origin; no live service implied.
security:
- bearerAuth: []
tags:
- name: Hospitals
  description: Catalog, nurse availability and incoming attempts.
- name: Dispatch
  description: Matching and request lifecycle.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Public process liveness
      description: Step 3 addition. Does not check database readiness or expose configuration.
      security: []
      parameters: []
      responses:
        '200':
          description: API process is serving requests.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /hospitals:
    get:
      operationId: listHospitals
      summary: List hospitals with all bed pools
      tags:
      - Hospitals
      description: 'Returns the complete demo catalog. No query parameters. Reading never verifies availability.
        Authorization: Nurse or dispatcher may read the configured hospital catalog. No patient records are included.
        All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      - nurse
      x-authorization: Nurse or dispatcher may read the configured hospital catalog. No patient records are included.
      parameters: []
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalsResponse'
              examples:
                01-success-01-catalog:
                  externalValue: ./examples/01-success/01-catalog.response.json
                04-no-eligible-00-catalog:
                  externalValue: ./examples/04-no-eligible/00-catalog.response.json
                05-stale-00-catalog:
                  externalValue: ./examples/05-stale/00-catalog.response.json
                06-capacity-unavailable-00-catalog:
                  externalValue: ./examples/06-capacity-unavailable/00-catalog.response.json
                08-last-bed-00-catalog:
                  externalValue: ./examples/08-last-bed/00-catalog.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /hospitals/{hospitalId}/bed-pools:
    get:
      operationId: listBedPools
      summary: List pools for one hospital
      tags:
      - Hospitals
      description: 'Returns current pool versions, counts, and freshness. No query parameters. Authorization: Nurse
        or dispatcher may read the configured hospital catalog. No patient records are included. All errors use
        ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      - nurse
      x-authorization: Nurse or dispatcher may read the configured hospital catalog. No patient records are included.
      parameters:
      - $ref: '#/components/parameters/hospitalId'
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedPoolsResponse'
              examples:
                07-nurse-conflict-01-read:
                  externalValue: ./examples/07-nurse-conflict/01-read.response.json
                07-nurse-conflict-04-refetch:
                  externalValue: ./examples/07-nurse-conflict/04-refetch.response.json
                10-hold-expiry-03-inventory:
                  externalValue: ./examples/10-hold-expiry/03-inventory.response.json
                11-cancel-hold-02-inventory:
                  externalValue: ./examples/11-cancel-hold/02-inventory.response.json
                12-cancel-request-02-inventory:
                  externalValue: ./examples/12-cancel-request/02-inventory.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /hospitals/{hospitalId}/bed-pools/{bedPoolId}:
    patch:
      operationId: updateBedPool
      summary: Update or explicitly verify free beds
      tags:
      - Hospitals
      description: 'Compare supplied version and enforce activeHoldCount <= reportedFreeBeds <= capacity atomically.
        update and verify refresh verifiedAt and inventoryUpdatedAt to serverTime and increment version, including
        same-count updates. verify requires the supplied count to equal the current count. Reads and replay never
        verify. Authorization: Nurse only; server-managed hospital assignment must equal hospitalId and the resource
        must belong to that hospital. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - nurse
      x-authorization: Nurse only; server-managed hospital assignment must equal hospitalId and the resource must
        belong to that hospital.
      parameters:
      - $ref: '#/components/parameters/hospitalId'
      - $ref: '#/components/parameters/bedPoolId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
            Idempotency-Replayed:
              description: true on replay; false on newly executed and stored result.
              schema:
                type: boolean
            Idempotency-Expires-At:
              description: End of the 24-hour replay guarantee. Present when an idempotency result has been stored.
              schema:
                $ref: '#/components/schemas/Timestamp'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedPoolResponse'
              examples:
                07-nurse-conflict-02-first-update:
                  externalValue: ./examples/07-nurse-conflict/02-first-update.response.json
                07-nurse-conflict-05-explicit-verify:
                  externalValue: ./examples/07-nurse-conflict/05-explicit-verify.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: JSON body exceeds the configured request-size limit. Error code INVALID_INPUT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
      x-conflict-codes:
      - VERSION_CONFLICT
      - FREE_COUNT_BELOW_HOLDS
      - VERIFICATION_COUNT_CHANGED
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityUpdate'
            examples:
              07-nurse-conflict-02-first-update:
                externalValue: ./examples/07-nurse-conflict/02-first-update.request.json
              07-nurse-conflict-03-conflicting-update:
                externalValue: ./examples/07-nurse-conflict/03-conflicting-update.request.json
              07-nurse-conflict-05-explicit-verify:
                externalValue: ./examples/07-nurse-conflict/05-explicit-verify.request.json
  /matches:
    post:
      operationId: findMatches
      summary: Find ranked matching hospitals
      tags:
      - Dispatch
      description: 'Read-only search; no Idempotency-Key needed. No capacity is reserved. All empty result conditions
        return 200 with distinct result.outcome. Server policy and score components explain ordering. Authorization:
        Dispatcher role required; no request record is created or read. Any unavailable or invalid travel estimate fails the search with 503 SERVICE_UNAVAILABLE, with no partial candidates or diagnostics. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      x-authorization: Dispatcher role required; no request record is created or read.
      parameters: []
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesResponse'
              examples:
                01-success-02-matches:
                  externalValue: ./examples/01-success/02-matches.response.json
                04-no-eligible-01-search:
                  externalValue: ./examples/04-no-eligible/01-search.response.json
                05-stale-01-search:
                  externalValue: ./examples/05-stale/01-search.response.json
                06-capacity-unavailable-01-search:
                  externalValue: ./examples/06-capacity-unavailable/01-search.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '413':
          description: JSON body exceeds the configured request-size limit. Error code INVALID_INPUT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchSearch'
            examples:
              01-success-02-matches:
                externalValue: ./examples/01-success/02-matches.request.json
              04-no-eligible-01-search:
                externalValue: ./examples/04-no-eligible/01-search.request.json
              05-stale-01-search:
                externalValue: ./examples/05-stale/01-search.request.json
              06-capacity-unavailable-01-search:
                externalValue: ./examples/06-capacity-unavailable/01-search.request.json
  /patient-requests:
    post:
      operationId: createPatientRequest
      summary: Create an anonymous patient request
      tags:
      - Dispatch
      description: 'Creates searching state and returns current nextBest options. Does not contact a hospital. Owner
        is taken from token; cannot be supplied in the body. Needs immutable in Step 1; cancel and create a new
        request to change them. Authorization: Dispatcher becomes the owner. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      x-authorization: Dispatcher becomes the owner.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
            Idempotency-Replayed:
              description: true on replay; false on newly executed and stored result.
              schema:
                type: boolean
            Idempotency-Expires-At:
              description: End of the 24-hour replay guarantee. Present when an idempotency result has been stored.
              schema:
                $ref: '#/components/schemas/Timestamp'
            Location:
              description: Relative /api/v1/patient-requests/{requestId} URL of the authoritative request snapshot.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              examples:
                01-success-03-create:
                  externalValue: ./examples/01-success/03-create.response.json
                02-rejection-01-create:
                  externalValue: ./examples/02-rejection/01-create.response.json
                03-timeout-01-create:
                  externalValue: ./examples/03-timeout/01-create.response.json
                08-last-bed-race_a-create:
                  externalValue: ./examples/08-last-bed/race_a-create.response.json
                08-last-bed-race_b-create:
                  externalValue: ./examples/08-last-bed/race_b-create.response.json
                09-retries-01-create-replay:
                  externalValue: ./examples/09-retries/01-create-replay.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
      x-conflict-codes:
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientRequest'
            examples:
              01-success-03-create:
                externalValue: ./examples/01-success/03-create.request.json
              02-rejection-01-create:
                externalValue: ./examples/02-rejection/01-create.request.json
              03-timeout-01-create:
                externalValue: ./examples/03-timeout/01-create.request.json
              08-last-bed-race_a-create:
                externalValue: ./examples/08-last-bed/race_a-create.request.json
              08-last-bed-race_b-create:
                externalValue: ./examples/08-last-bed/race_b-create.request.json
              09-retries-01-create-replay:
                externalValue: ./examples/09-retries/01-create-replay.request.json
              09-retries-03-conflicting-payload:
                externalValue: ./examples/09-retries/03-conflicting-payload.request.json
  /patient-requests/{requestId}:
    get:
      operationId: getPatientRequest
      summary: Get request progress, history, hold, fallback
      tags:
      - Dispatch
      description: 'Returns authoritative state after resolving any deadlines and hold expiry. These lifecycle transitions
        may be materialized on reads; verification timestamps never change. No query parameters. Authorization:
        Dispatcher only; request.ownerId equals authenticated subject. No organization-wide sharing in this demo.
        All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      x-authorization: Dispatcher only; request.ownerId equals authenticated subject. No organization-wide sharing
        in this demo.
      parameters:
      - $ref: '#/components/parameters/requestId'
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              examples:
                01-success-07-status:
                  externalValue: ./examples/01-success/07-status.response.json
                01-success-09-arrived-status:
                  externalValue: ./examples/01-success/09-arrived-status.response.json
                02-rejection-04-fallback-offer:
                  externalValue: ./examples/02-rejection/04-fallback-offer.response.json
                03-timeout-04-fallback-offer:
                  externalValue: ./examples/03-timeout/04-fallback-offer.response.json
                08-last-bed-07-loser-status:
                  externalValue: ./examples/08-last-bed/07-loser-status.response.json
                10-hold-expiry-01-expired-status:
                  externalValue: ./examples/10-hold-expiry/01-expired-status.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /patient-requests/{requestId}/attempts:
    post:
      operationId: createAttempt
      summary: Send a confirmed hospital request
      tags:
      - Dispatch
      description: 'Only from searching. Revalidate selected pool belongs to hospital, all requirements, verification
        age < stale threshold, and availableBeds >= 1. Exclude all previously attempted hospitals. Create exactly
        one pending attempt with deadline serverTime + 120 seconds; pending does not reserve capacity. Concurrent
        sends serialize; one succeeds. Rejection/timeout only OFFERS fallback; this endpoint sends it after explicit
        dispatcher confirmation. Authorization: Dispatcher only; request.ownerId equals authenticated subject. No
        organization-wide sharing in this demo. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - dispatcher
      x-authorization: Dispatcher only; request.ownerId equals authenticated subject. No organization-wide sharing
        in this demo.
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
            Idempotency-Replayed:
              description: true on replay; false on newly executed and stored result.
              schema:
                type: boolean
            Idempotency-Expires-At:
              description: End of the 24-hour replay guarantee. Present when an idempotency result has been stored.
              schema:
                $ref: '#/components/schemas/Timestamp'
            Location:
              description: Relative /api/v1/patient-requests/{requestId} URL of the authoritative request snapshot.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
              examples:
                01-success-04-send:
                  externalValue: ./examples/01-success/04-send.response.json
                02-rejection-02-send:
                  externalValue: ./examples/02-rejection/02-send.response.json
                02-rejection-05-confirm-fallback:
                  externalValue: ./examples/02-rejection/05-confirm-fallback.response.json
                03-timeout-02-send:
                  externalValue: ./examples/03-timeout/02-send.response.json
                03-timeout-05-confirm-fallback:
                  externalValue: ./examples/03-timeout/05-confirm-fallback.response.json
                08-last-bed-race_a-send:
                  externalValue: ./examples/08-last-bed/race_a-send.response.json
                08-last-bed-race_b-send:
                  externalValue: ./examples/08-last-bed/race_b-send.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
      x-conflict-codes:
      - REQUEST_NOT_SEARCHING
      - HOSPITAL_ALREADY_ATTEMPTED
      - POOL_REQUIREMENTS_NOT_MET
      - CAPACITY_UNAVAILABLE
      - AVAILABILITY_OUTDATED
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttempt'
            examples:
              01-success-04-send:
                externalValue: ./examples/01-success/04-send.request.json
              02-rejection-02-send:
                externalValue: ./examples/02-rejection/02-send.request.json
              02-rejection-05-confirm-fallback:
                externalValue: ./examples/02-rejection/05-confirm-fallback.request.json
              03-timeout-02-send:
                externalValue: ./examples/03-timeout/02-send.request.json
              03-timeout-05-confirm-fallback:
                externalValue: ./examples/03-timeout/05-confirm-fallback.request.json
              08-last-bed-race_a-send:
                externalValue: ./examples/08-last-bed/race_a-send.request.json
              08-last-bed-race_b-send:
                externalValue: ./examples/08-last-bed/race_b-send.request.json
  /hospitals/{hospitalId}/incoming-requests:
    get:
      operationId: getHospitalInbox
      summary: Poll hospital inbox and active holds
      tags:
      - Hospitals
      description: 'Returns pending attempts and active holds after deadline/expiry reconciliation. Empty arrays
        are normal. No query parameters. Does not return unrelated attempts or request owner IDs. Authorization:
        Nurse only; server-managed hospital assignment must equal hospitalId and the resource must belong to that
        hospital. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - nurse
      x-authorization: Nurse only; server-managed hospital assignment must equal hospitalId and the resource must
        belong to that hospital.
      parameters:
      - $ref: '#/components/parameters/hospitalId'
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
              description: Current HTTP response generation time; use with immediate refetch after idempotent replay.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxResponse'
              examples:
                01-success-05-inbox:
                  externalValue: ./examples/01-success/05-inbox.response.json
                01-success-07b-held-inbox:
                  externalValue: ./examples/01-success/07b-held-inbox.response.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /hospitals/{hospitalId}/attempts/{attemptId}/accept:
    post:
      operationId: acceptAttempt
      summary: Accept and atomically reserve one bed
      tags:
      - Hospitals
      description: 'Under one serialized transaction: reconcile deadlines, ensure pending with serverNow < responseDeadlineAt,
        verify request has no other pending attempt/active hold, recheck requirements, freshness and availableBeds
        >= 1, then mark accepted, create one hold, increment pool version, set request held. Hold expires acceptance
        time + configured duration. Recheck time immediately before transition. Failed capacity/freshness checks
        leave the attempt pending until rejection or timeout. Late acceptance returns ATTEMPT_DEADLINE_PASSED even
        if the worker is delayed. Authorization: Nurse only; server-managed hospital assignment must equal hospitalId
        and the resource must belong to that hospital. All errors use ErrorResponse.'
      security:
      - bearerAuth: []
      x-roles:
      - nurse
      x-authorization: Nurse only; server-managed hospital assignment must equal hospitalId and the resource must
        belong to that hospital.
      parameters:
      - $ref: '#/components/parameters/hospitalId'
      - $ref: '#/components/parameters/attemptId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Always no-store. Do not serve cached capacity or request state.
              schema:
                type: string
                const: no-store
            Date:
